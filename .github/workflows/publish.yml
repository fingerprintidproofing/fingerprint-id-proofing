name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # Removed permissions block as OIDC id-token claims are no longer necessary

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Dependency Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        # Pristine offline dependency compilation to safely navigate past cloud proxy firewall walls
        run: |
          npm config set registry https://npmjs.org
          npm ci --prefer-offline --no-audit --no-fund || npm install --prefer-offline --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Copy TypeScript Declaration Files
        run: |
          cp src/index.d.ts ./index.d.ts || true
          cp src/backend.d.ts ./backend.d.ts || true

      - name: Publish to npm Registry via Classic Access Token
        # Removed '--provenance' since provenance signatures are strictly tied to OIDC workflows.
        # Authenticates seamlessly by feeding the repository secret straight into the npm client profile.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
