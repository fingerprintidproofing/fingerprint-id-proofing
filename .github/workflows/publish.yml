name: publish

on:
  release:
    types: [published]
  workflow_dispatch: # Allows you to test from the GitHub Actions tab without creating a new release

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MANDATORY: Injects ACTIONS_ID_TOKEN_REQUEST_URL for OIDC
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies & Build
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to npm via OIDC
        run: |
          npx --yes npm@latest publish --provenance --access public --ignore-scripts