name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npmjs.org'

      - name: Install Dependencies
        # Fixes the URL path to use 'registry.npmjs.org/' with the proper trailing slash
        # and tells npm to dynamically fetch package assets, bypassing lockfile target domain bugs.
        run: |
          npm install --registry=https://npmjs.org --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Copy TypeScript Declaration Files
        run: |
          cp src/index.d.ts ./index.d.ts || true
          cp src/backend.d.ts ./backend.d.ts || true

      - name: Publish to npm Registry via Classic Access Token
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
