name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MANDATORY: Allows GitHub to sign the cryptographic handshake
      contents: read   # MANDATORY: Allows the checkout of your source files

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Dependency Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Copy TypeScript Declaration Files
        run: |
          cp src/index.d.ts ./index.d.ts || true
          cp src/backend.d.ts ./backend.d.ts || true

      - name: Publish to npm Registry via Secure OIDC Handshake
        # --provenance registers the build validation matrix cleanly on the public log ledger
        run: npm publish --provenance --access public
