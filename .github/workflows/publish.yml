name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        # Clean sandbox installation. Notice that NO environment variables or tokens 
        # are injected here. This allows public packages to download normally.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Copy TypeScript Declaration Files
        run: |
          cp src/index.d.ts ./index.d.ts || true
          cp src/backend.d.ts ./backend.d.ts || true

      - name: Publish to npm Registry via Classic Access Token
        # The NPM token secret is injected strictly inside this execution block.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
