name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Dependency Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npmjs.org' # Ensure the trailing slash is present

      - name: Install Dependencies
        # Completely removed 'npm config set'. We force the explicit registry URL argument 
        # directly into the installer commands to bypass the firewall routing block.
        run: |
          npm ci --registry=https://npmjs.org --prefer-offline --no-audit --no-fund || npm install --registry=https://npmjs.org --prefer-offline --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Copy TypeScript Declaration Files
        run: |
          cp src/index.d.ts ./index.d.ts || true
          cp src/backend.d.ts ./backend.d.ts || true

      - name: Publish to npm Registry via Classic Access Token
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
