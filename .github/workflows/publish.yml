name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory rule to register OIDC handshake tokens
      contents: read   # Mandatory rule to check out repository code bases

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Dependency Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # We do NOT run 'npm run build' manually here because 'prepublishOnly' 
      # inside package.json automatically builds the assets during npm publish.

      - name: Publish to npm Registry via Secure OIDC Handshake
        # --provenance registers the build validation matrix cleanly on the public log ledger
        run: npm publish --provenance --access public
