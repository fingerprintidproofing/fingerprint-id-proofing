name: Publish to npm

on:
  release:
    types: [published] # Triggers when you create a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 👈 MANDATORY: Gives GitHub permission to mint the OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Run your build step if your code needs compilation/obfuscation
      - name: Build package
        run: npm run build --if-present

      # --provenance binds the npm package to this exact GitHub Action run
      - name: Publish to npm registry
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Uses the temporary OIDC session token
