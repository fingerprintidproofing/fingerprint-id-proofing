name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MANDATORY: Allows GitHub to sign the cryptographic OIDC handshake
      contents: read   # MANDATORY: Allows checking out your repository source files

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to >= 11.5.1 (Mandatory for OIDC Trusted Publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Assets
        run: npm run build

      - name: Publish to npm Registry via Secure OIDC Handshake
        run: npm publish --provenance --access public --ignore-scripts